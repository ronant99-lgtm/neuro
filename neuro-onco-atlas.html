<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Pediatric Neuro-Oncology Atlas</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
/* ── RESET ── */
* { box-sizing: border-box; margin: 0; padding: 0; }

/* ── THÈME (root + body.light) ── */
:root {
  --bg: #0d1117; --surface: #161b22; --surface2: #1c2330; --surface3: #21262d;
  --border: #2a3441; --border2: #30363d;
  --text: #e6edf3; --text2: #8b949e; --text3: #6e7681;
  --green: #3fb950; --blue: #388bfd; --red: #f85149; --yellow: #d29922;
  --purple: #a371f7; --orange: #f0883e; --cyan: #39c5cf; --grey: #8b949e;
  --accent: #39c5cf; --accent-rgb: 57,197,207;
  --radius: 10px;
}
body.light {
  --bg: #f5f0e8; --surface: #ffffff; --surface2: #ede8dc; --surface3: #e6e0d2;
  --border: #c8bfaa; --border2: #d4ccba;
  --text: #1a1208; --text2: #5a4f3a; --text3: #9a8f7a;
  --green: #2d7a3a; --blue: #1a5fa8; --red: #c0392b; --yellow: #a0720a;
  --purple: #6b3fa0; --orange: #c45a10; --cyan: #1a7a8a; --grey: #6e6656;
  --accent: #1a7a8a; --accent-rgb: 26,122,138;
}

/* ── BASE ── */
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; min-height: 100vh; }
a { color: var(--accent); }
strong { font-weight: 600; }
.mono { font-family: 'DM Mono', monospace; }
.container { max-width: 1180px; margin: 0 auto; padding: 24px 20px 80px; }

/* ── HEADER ── */
header {
  position: sticky; top: 0; z-index: 200;
  background: rgba(13,17,23,0.96); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 12px 20px; display: flex; align-items: center; gap: 12px; flex-wrap: nowrap;
}
body.light header { background: rgba(245,240,232,0.97); backdrop-filter: blur(10px); }
.hdr-logo { width: 32px; height: 32px; border: 1.5px solid var(--accent); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-family: 'DM Mono', monospace; font-size: 9px; color: var(--accent); font-weight: 500; flex-shrink: 0; cursor: pointer; }
.hdr-texts { flex: 1; min-width: 0; }
.hdr-title { font-family: 'DM Serif Display', serif; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hdr-sub { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--text3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hdr-badge { font-family: 'DM Mono', monospace; font-size: 9px; padding: 3px 10px; border-radius: 20px; background: rgba(var(--accent-rgb), .1); border: 1px solid rgba(var(--accent-rgb), .3); color: var(--accent); margin-left: auto; flex-shrink: 0; white-space: nowrap; }
.btn-theme { width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--border2); background: transparent; color: var(--text2); font-size: 14px; cursor: pointer; transition: all .18s; display: flex; align-items: center; justify-content: center; margin-left: 8px; flex-shrink: 0; }
.btn-theme:hover { border-color: var(--accent); color: var(--accent); }
@media (max-width: 640px) { .hdr-badge { display: none; } }

/* ── BREADCRUMB ── */
.crumbs { position: sticky; z-index: 150; background: var(--surface); border-bottom: 1px solid var(--border); padding: 8px 20px; font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text3); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
body.light .crumbs { background: var(--surface2); }
.crumbs a { color: var(--text2); text-decoration: none; cursor: pointer; }
.crumbs a:hover { color: var(--accent); }
.crumbs .sep { color: var(--text3); }
.crumbs .cur { color: var(--text); }

/* ── HOME ── */
.hero { margin-bottom: 26px; }
.hero h1 { font-family: 'DM Serif Display', serif; font-size: 28px; font-weight: 400; line-height: 1.2; margin-bottom: 8px; }
.hero p { color: var(--text2); max-width: 820px; font-size: 13.5px; }
.section-label { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 2px; color: var(--text3); text-transform: uppercase; margin: 26px 0 10px; }
.ent-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.ent-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; cursor: pointer; transition: all .2s; position: relative; overflow: hidden; }
.ent-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--accent); }
.ent-card:hover { border-color: var(--accent); transform: translateY(-1px); }
.ent-card.planned { cursor: default; opacity: .55; }
.ent-card.planned::before { background: var(--border2); }
.ent-card.planned:hover { border-color: var(--border); transform: none; }
.ent-fam { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--text3); letter-spacing: 1px; text-transform: uppercase; }
.ent-name { font-family: 'DM Serif Display', serif; font-size: 19px; margin: 4px 0 6px; }
.ent-desc { font-size: 12px; color: var(--text2); margin-bottom: 10px; }
.ent-meta { display: flex; flex-wrap: wrap; gap: 5px; }
body.light .ent-card, body.light .sit-tile, body.light .sit-card, body.light .arm, body.light .ctx { box-shadow: 0 1px 4px rgba(0,0,0,.06); }

/* ── CHIPS / BADGES ── */
.chip { font-family: 'DM Mono', monospace; font-size: 9px; padding: 2px 7px; border-radius: 4px; border: 1px solid var(--border2); color: var(--text2); white-space: nowrap; display: inline-block; }
.chip.cog { color: var(--orange); border-color: rgba(240,136,62,.4); background: rgba(240,136,62,.08); }
.chip.siop { color: var(--blue); border-color: rgba(56,139,253,.4); background: rgba(56,139,253,.08); }
.chip.lit { color: var(--purple); border-color: rgba(163,113,247,.4); background: rgba(163,113,247,.08); }
.chip.pend { color: var(--text3); border-style: dashed; }
.chip.verify { color: var(--yellow); border-color: rgba(210,153,34,.45); background: rgba(210,153,34,.08); }
.ev { font-family: 'DM Mono', monospace; font-size: 9px; padding: 2px 8px; border-radius: 20px; white-space: nowrap; display: inline-block; border: 1px solid; }
.ev.rct { color: var(--green); border-color: rgba(63,185,80,.45); }
.ev.trial { color: var(--blue); border-color: rgba(56,139,253,.45); }
.ev.cons { color: var(--cyan); border-color: rgba(57,197,207,.45); }
.ev.retro { color: var(--yellow); border-color: rgba(210,153,34,.45); }
.ev.exp { color: var(--orange); border-color: rgba(240,136,62,.45); }
.ev.pend { color: var(--text3); border-color: var(--border2); border-style: dashed; }
.risk-badge { font-family: 'DM Mono', monospace; font-size: 9.5px; padding: 3px 9px; border-radius: 20px; font-weight: 500; white-space: nowrap; flex-shrink: 0; }
.risk-badge.lr { background: rgba(63,185,80,.14); color: var(--green); }
.risk-badge.sr { background: rgba(56,139,253,.14); color: var(--blue); }
.risk-badge.hr { background: rgba(248,81,73,.14); color: var(--red); }
.risk-badge.sp { background: rgba(210,153,34,.14); color: var(--yellow); }
.risk-badge.inf { background: rgba(163,113,247,.14); color: var(--purple); }
.risk-badge.off { background: rgba(139,148,158,.14); color: var(--grey); }

/* ── LEGEND ── */
.legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
.legend-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
.legend-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text2); margin: 5px 0; }

/* ── ENTITY PAGE ── */
.ent-head { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: flex-start; margin-bottom: 14px; }
.ent-head h1 { font-family: 'DM Serif Display', serif; font-size: 26px; font-weight: 400; }
.ent-head .sub { color: var(--text2); font-size: 12.5px; margin-top: 3px; }
.ent-srcs { display: flex; gap: 6px; flex-wrap: wrap; }
.id-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; margin-bottom: 12px; }
.id-cell { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; }
.id-k { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--text3); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 3px; }
.id-v { font-size: 12px; color: var(--text); }
.alert { border-left: 3px solid var(--yellow); background: rgba(210,153,34,.07); border-radius: 6px; padding: 8px 12px; font-size: 12px; color: var(--text2); margin-bottom: 6px; }
.alert.red { border-left-color: var(--red); background: rgba(248,81,73,.07); }
.alert.blue { border-left-color: var(--blue); background: rgba(56,139,253,.07); }
.view-tabs { display: flex; border-bottom: 1px solid var(--border); margin: 18px 0 16px; gap: 4px; }
.view-tab { padding: 9px 16px; border: none; background: none; color: var(--text2); font-family: 'DM Sans', sans-serif; font-size: 12.5px; font-weight: 500; cursor: pointer; border-bottom: 2px solid transparent; }
.view-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.view-tab:hover { color: var(--accent); }

/* ── FILTERS ── */
.filters { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.f-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.f-lbl { font-family: 'DM Mono', monospace; font-size: 9.5px; color: var(--text3); letter-spacing: 1px; text-transform: uppercase; min-width: 150px; }
.f-btn { font-family: 'DM Sans', sans-serif; font-size: 11.5px; padding: 4px 11px; border-radius: 20px; border: 1px solid var(--border2); background: var(--surface); color: var(--text2); cursor: pointer; transition: all .15s; }
.f-btn:hover { border-color: var(--accent); color: var(--accent); }
.f-btn.on { background: rgba(var(--accent-rgb), .14); border-color: var(--accent); color: var(--accent); }
.f-reset { font-family: 'DM Mono', monospace; font-size: 10px; background: none; border: none; color: var(--text3); cursor: pointer; text-decoration: underline; }

/* ── SITUATION MAP ── */
.grp { margin-bottom: 18px; }
.grp-title { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1.5px; color: var(--text3); text-transform: uppercase; margin-bottom: 8px; display: flex; gap: 8px; align-items: center; }
.grp-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.sit-tile { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--grey); border-radius: 8px; padding: 12px 14px; cursor: pointer; transition: all .18s; }
.sit-tile:hover { border-color: var(--accent); }
.sit-tile.dim { opacity: .22; }
.sit-tile.lr { border-left-color: var(--green); } .sit-tile.sr { border-left-color: var(--blue); } .sit-tile.hr { border-left-color: var(--red); }
.sit-tile.sp { border-left-color: var(--yellow); } .sit-tile.inf { border-left-color: var(--purple); } .sit-tile.off { border-left-color: var(--grey); }
.tile-top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; margin-bottom: 6px; }
.tile-title { font-weight: 600; font-size: 13px; line-height: 1.35; }
.tile-def { font-size: 11.5px; color: var(--text2); margin-bottom: 8px; }
.tile-arms { display: flex; flex-direction: column; gap: 4px; }
.tile-arm { display: flex; gap: 6px; align-items: baseline; font-size: 11px; }
.tile-arm .k { font-family: 'DM Mono', monospace; font-size: 10.5px; color: var(--text); }

/* ── CONTEXT SECTIONS ── */
.ctx { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; }
.ctx summary { cursor: pointer; padding: 12px 16px; font-weight: 600; font-size: 13px; list-style: none; display: flex; justify-content: space-between; align-items: center; }
.ctx summary::-webkit-details-marker { display: none; }
.ctx summary::after { content: '+'; font-family: 'DM Mono', monospace; color: var(--text3); }
.ctx[open] summary::after { content: '−'; }
.ctx-body { padding: 4px 16px 16px; font-size: 12.5px; color: var(--text2); }
.ctx-body p { margin: 6px 0; }
.ctx-body ul { margin: 6px 0 6px 18px; }
.tbl-wrap { overflow-x: auto; margin: 8px 0; }
table.t { border-collapse: collapse; width: 100%; font-size: 12px; }
table.t th { font-family: 'DM Mono', monospace; font-size: 9.5px; letter-spacing: .8px; text-transform: uppercase; color: var(--text3); text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--border2); background: var(--surface2); white-space: nowrap; }
table.t td { padding: 7px 9px; border-bottom: 1px solid var(--border); color: var(--text); vertical-align: top; }
table.t td.k { color: var(--text2); font-weight: 500; white-space: nowrap; }
table.t tr:hover td { background: var(--surface2); }
.trial-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; margin-top: 6px; }
.trial-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 11px 13px; }
.trial-top { display: flex; justify-content: space-between; gap: 6px; margin-bottom: 5px; align-items: center; }
.nct { font-family: 'DM Mono', monospace; font-size: 11px; }
.st { font-family: 'DM Mono', monospace; font-size: 8.5px; padding: 2px 7px; border-radius: 10px; }
.st.rec { background: rgba(63,185,80,.14); color: var(--green); }
.st.done { background: rgba(139,148,158,.16); color: var(--grey); }
.st.pend { background: rgba(210,153,34,.14); color: var(--yellow); }
.trial-title { font-size: 12px; color: var(--text); font-weight: 500; margin-bottom: 4px; }
.trial-meta { font-size: 11px; color: var(--text2); }

/* ── SITUATION CARD ── */
.btn-back { background: none; border: 1px solid var(--border2); color: var(--text2); font-family: 'DM Mono', monospace; font-size: 11px; padding: 6px 12px; border-radius: 6px; cursor: pointer; margin-bottom: 12px; }
.btn-back:hover { border-color: var(--accent); color: var(--accent); }
.sit-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.sit-card::before { content: ''; display: block; height: 4px; background: var(--grey); }
.sit-card.lr::before { background: var(--green); } .sit-card.sr::before { background: var(--blue); } .sit-card.hr::before { background: var(--red); }
.sit-card.sp::before { background: var(--yellow); } .sit-card.inf::before { background: var(--purple); }
.sit-head { padding: 18px 20px 12px; display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap; align-items: flex-start; border-bottom: 1px solid var(--border); }
.sit-ent { font-family: 'DM Mono', monospace; font-size: 9.5px; color: var(--text3); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 4px; }
.sit-title { font-family: 'DM Serif Display', serif; font-size: 22px; line-height: 1.25; }
.sit-body { padding: 16px 20px 20px; }
.r-label { font-family: 'DM Mono', monospace; font-size: 9.5px; letter-spacing: 1.5px; color: var(--text3); text-transform: uppercase; margin-bottom: 7px; }
.def-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px; margin-bottom: 18px; }
.def-cell { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 9px 11px; }
.def-k { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--text3); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 3px; }
.def-v { font-size: 12px; color: var(--text); line-height: 1.5; }
.arms { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); align-items: start; }
.arm { background: var(--surface); border: 1px solid var(--border2); border-radius: 8px; overflow: hidden; }
.arm-head { padding: 10px 13px; background: var(--surface2); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: center; }
.arm-head.cog { border-top: 3px solid var(--orange); } .arm-head.siop { border-top: 3px solid var(--blue); } .arm-head.lit { border-top: 3px solid var(--purple); }
.arm-proto { font-weight: 600; font-size: 13px; }
.arm-sub { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text2); }
.arm-body { padding: 12px 13px; }
.arm.pending { border-style: dashed; background: transparent; }
.arm.pending .arm-body { color: var(--text3); font-size: 12px; font-style: italic; }
.blk { margin-bottom: 12px; }
.blk:last-child { margin-bottom: 0; }
.outcomes-block { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 9px 11px; }
.outcome-row { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; border-bottom: 1px dashed var(--border); font-size: 12px; }
.outcome-row:last-child { border-bottom: none; }
.outcome-label { color: var(--text2); }
.outcome-val { font-family: 'DM Mono', monospace; font-size: 11.5px; text-align: right; }
.ov-good { color: var(--green); } .ov-mid { color: var(--yellow); } .ov-bad { color: var(--red); } .ov-neu { color: var(--text2); }
.o-note { font-size: 11px; color: var(--text3); margin-top: 5px; }
.r-val { font-size: 12.5px; color: var(--text); line-height: 1.55; }
.r-val ul { margin: 4px 0 4px 16px; }
.rt-block { background: var(--surface2); border: 1px solid var(--border); border-left: 3px solid var(--blue); border-radius: 8px; padding: 12px; }
.rt-block-title { font-family: 'DM Mono', monospace; font-size: 9.5px; letter-spacing: 1.5px; color: var(--blue); text-transform: uppercase; margin-bottom: 10px; }
.rt-section { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
.rt-section:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
.rt-section-hdr { font-size: 12px; font-weight: 500; color: var(--text); margin-bottom: 6px; }
.rt-note { font-size: 12px; color: var(--text2); line-height: 1.5; }
.rt-box { background: var(--surface3); border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px; margin-bottom: 6px; }
.rt-box:last-child { margin-bottom: 0; }
.rt-box-label { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--text3); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 3px; }
.rt-box-val { font-size: 12px; color: var(--text); line-height: 1.5; }
.rt-dose { color: var(--blue); font-family: 'DM Mono', monospace; font-size: 12.5px; font-weight: 500; }
.rt-dose.esc { color: var(--yellow); }
.rt-dose.highesc { color: var(--red); }
.rt-sub { font-size: 11px; color: var(--text2); margin-top: 3px; line-height: 1.45; }
.no-rt-box { background: var(--surface2); border: 1px solid var(--border); border-left: 3px solid var(--text3); border-radius: 8px; padding: 10px 13px; font-size: 12.5px; color: var(--text2); }
.note-box { border-left: 3px solid var(--yellow); background: rgba(210,153,34,.06); padding: 9px 12px; border-radius: 6px; font-size: 12px; color: var(--text2); line-height: 1.55; }
.common { margin-top: 18px; }
.refs-list { margin-top: 18px; border-top: 1px solid var(--border); padding-top: 12px; }
.ref-item { display: flex; gap: 10px; margin-bottom: 9px; font-size: 11.5px; }
.ref-num { font-family: 'DM Mono', monospace; color: var(--accent); min-width: 22px; }
.ref-authors { color: var(--text); }
.ref-title-text { color: var(--text2); font-style: italic; }
.ref-journal { color: var(--text3); font-family: 'DM Mono', monospace; font-size: 10.5px; }
.ref-note { color: var(--text2); font-size: 11px; margin-top: 2px; }
.sit-actions { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
.btn { background: var(--surface2); border: 1px solid var(--border2); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 12px; padding: 7px 13px; border-radius: 6px; cursor: pointer; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: .35; cursor: default; }
sup { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--accent); }

/* ── D3 FLOWCHART ── */
#flowHost { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
#chart { width: 100%; height: 100%; cursor: grab; display: block; }
#chart:active { cursor: grabbing; }
.btn-reset-zoom { position: absolute; top: 14px; right: 14px; background: var(--surface); border: 1px solid var(--border2); color: var(--text2); padding: 7px 14px; border-radius: 6px; font-family: 'DM Mono', monospace; font-size: 11px; cursor: pointer; z-index: 10; }
.btn-reset-zoom:hover { border-color: var(--accent); color: var(--accent); }
.flow-legend { position: absolute; bottom: 12px; left: 14px; display: flex; flex-wrap: wrap; gap: 10px; z-index: 10; pointer-events: none; }
.leg-it { display: flex; align-items: center; gap: 5px; font-family: 'DM Mono', monospace; font-size: 9px; color: var(--text2); }
.leg-dot { width: 9px; height: 9px; border-radius: 50%; }
.flow-hint { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text3); margin-bottom: 8px; }

var THEME_KEY = 'theme-neuro-onco-atlas';
function initTheme() {
  try { if (localStorage.getItem(THEME_KEY) === 'light') applyTheme('light'); } catch (e) {}
}
function toggleTheme() {
  applyTheme(document.body.classList.contains('light') ? 'dark' : 'light');
}
function applyTheme(mode) {
  var btn = document.getElementById('btn-theme');
  if (mode === 'light') {
    document.body.classList.add('light');
    btn.textContent = '☀'; btn.title = 'Switch to dark mode';
    try { localStorage.setItem(THEME_KEY, 'light'); } catch (e) {}
  } else {
    document.body.classList.remove('light');
    btn.textContent = '◑'; btn.title = 'Switch to light mode';
    try { localStorage.setItem(THEME_KEY, 'dark'); } catch (e) {}
  }
}

var FILTERS = {};

function fixLayout() {
  var hh = document.querySelector('header').offsetHeight;
  document.getElementById('crumbs').style.top = hh + 'px';
}
function route() {
  var h = location.hash.replace(/^#\/?/, '');
  var p = h ? h.split('/') : [];
  document.getElementById('tt').style.display = 'none';
  if (p[0] === 'e' && ENTITIES[p[1]]) {
    if (p[2] === 's' && ENTITIES[p[1]].situations[p[3]]) renderSit(p[1], p[3]);
    else renderEntity(p[1], p[2] === 'flow' ? 'flow' : 'map');
  } else {
    renderHome();
  }
  window.scrollTo(0, 0);
}

    html += '<span class="sep">›</span>' + (it.h ? '<a onclick="go(\'' + it.h + '\')">' + it.t + '</a>' : '<span class="cur">' + it.t + '</span>');
  });
  document.getElementById('crumbs').innerHTML = html;
}

function setFilter(eid, ax, v) {
  FILTERS[eid] = FILTERS[eid] || {};
  FILTERS[eid][ax] = FILTERS[eid][ax] === v ? null : v;
  renderEntity(eid, 'map', true);
}
function resetFilters(eid) { FILTERS[eid] = {}; renderEntity(eid, 'map', true); }

function renderEntity(eid, tab, keepScroll) {
  var e = ENTITIES[eid];
  setCrumbs([ { t: e.name } ]);
  var f = FILTERS[eid] || {};
  var html = '<div class="ent-head"><div><div class="ent-fam">' + e.family + '</div><h1>' + e.name + '</h1><div class="sub">' + e.desc + '</div></div>'
    + '<div class="ent-srcs">' + e.sources.map(function(s) { return '<span class="chip ' + s.c + '">' + s.t + '</span>'; }).join('') + '</div></div>';
  html += '<div class="id-strip">' + e.identity.map(function(i) { return '<div class="id-cell"><div class="id-k">' + i.k + '</div><div class="id-v">' + i.v + '</div></div>'; }).join('') + '</div>';
  html += e.alerts.map(function(a) { return '<div class="alert ' + a.c + '">' + a.t + '</div>'; }).join('');
  html += '<div class="view-tabs"><button class="view-tab' + (tab === 'map' ? ' active' : '') + '" onclick="go(\'#/e/' + eid + '\')">⬡ Decision map</button>'
    + (e.flow ? '<button class="view-tab' + (tab === 'flow' ? ' active' : '') + '" onclick="go(\'#/e/' + eid + '/flow\')">⬡ Interactive flowchart</button>' : '') + '</div>';

  if (tab === 'flow') {
    html += '<div class="flow-hint">Hover a final node for the summary · click it to open the full situation card · drag / pinch to pan and zoom</div>'
      + '<div id="flowHost"><svg id="chart"></svg><button class="btn-reset-zoom" id="btnReset">⊙ Recentre</button>'
      + '<div class="flow-legend"><div class="leg-it"><div class="leg-dot" style="background:#1a5fa8"></div>Decision</div>'
      + '<div class="leg-it"><div class="leg-dot" style="background:#2d7a3a"></div>Low risk</div><div class="leg-it"><div class="leg-dot" style="background:#388bfd"></div>Standard</div>'
      + '<div class="leg-it"><div class="leg-dot" style="background:#c0392b"></div>High risk</div><div class="leg-it"><div class="leg-dot" style="background:#a0720a"></div>Special</div>'
      + '<div class="leg-it"><div class="leg-dot" style="background:#6b3fa0"></div>Infant / HDCT</div><div class="leg-it"><div class="leg-dot" style="background:#888"></div>Off protocol</div></div></div>';
    document.getElementById('view').innerHTML = html;
    var hh = document.querySelector('header').offsetHeight + document.getElementById('crumbs').offsetHeight;
    document.getElementById('flowHost').style.height = Math.max(480, window.innerHeight - hh - 60) + 'px';
    buildFlow(e);
    return;
  }

  // Filtres
  html += '<div class="filters">' + e.axes.map(function(ax) {
    return '<div class="f-row"><span class="f-lbl">' + ax.label + '</span>' + ax.opts.map(function(o) {
      return '<button class="f-btn' + (f[ax.id] === o.v ? ' on' : '') + '" onclick="setFilter(\'' + eid + '\',\'' + ax.id + '\',\'' + o.v + '\')">' + o.l + '</button>';
    }).join('') + '</div>';
  }).join('') + '<div class="f-row"><button class="f-reset" onclick="resetFilters(\'' + eid + '\')">reset filters</button></div></div>';

  // Carte des situations
  e.groups.forEach(function(g) {
    html += '<div class="grp"><div class="grp-title">' + g.t + '</div><div class="tiles">';
    g.ids.forEach(function(sid) {
      var s = e.situations[sid];
      var dim = tagMatch(s, f) ? '' : ' dim';
      html += '<div class="sit-tile ' + s.risk + dim + '" onclick="go(\'#/e/' + eid + '/s/' + sid + '\')">'
        + '<div class="tile-top"><div class="tile-title">' + s.title + '</div><span class="risk-badge ' + s.risk + '">' + s.risk.toUpperCase() + '</span></div>'
        + '<div class="tile-arms">' + s.arms.map(function(a) {
            return '<div class="tile-arm"><span class="chip ' + a.pc + '">' + shortProto(a.proto) + '</span><span class="k">' + a.key + '</span></div>';
          }).join('') + '</div></div>';
    });
    html += '</div></div>';
  });

  // Contexte
  html += '<div class="section-label">Reference sections</div>';
  e.context.forEach(function(c) { html += '<details class="ctx"><summary>' + c.t + '</summary><div class="ctx-body">' + c.h + '</div></details>'; });
  if (e.trials.length) html += '<details class="ctx"><summary>Clinical trials</summary><div class="ctx-body"><div class="trial-grid">' + e.trials.map(function(t) {
    var link = /^NCT\d{8}$/.test(t.id) ? '<a class="nct" href="https://clinicaltrials.gov/study/' + t.id + '" target="_blank">' + t.id + '</a>' : '<span class="nct">' + t.id + '</span>';
    return '<div class="trial-card"><div class="trial-top">' + link + '<span class="st ' + t.st + '">' + t.stl + '</span></div><div class="trial-title">' + t.t + '</div><div class="trial-meta">' + t.m + '</div></div>';
  }).join('') + '</div></div></details>';
  html += '<details class="ctx"><summary>References</summary><div class="ctx-body">' + refsHtml(e, Object.keys(e.refs)) + '</div></details>';
  document.getElementById('view').innerHTML = html;
}
function shortProto(p) {
  if (p.indexOf('SIOP CNS GCT II') === 0) return 'SIOP GCT II';
  if (p.indexOf('Option A') === 0) return 'Option A';
  if (p.indexOf('Option B') === 0) return 'Option B';
  if (p.indexOf('Consensus') === 0) return 'Consensus';
  return p;
}

// ═══ RENDU — CARTE SITUATION ═══
function outcomesHtml(a) {
  var rows = a.out.map(function(o) {
    return '<div class="outcome-row"><span class="outcome-label">' + o.l + '</span><span class="outcome-val ' + (o.c || 'ov-neu') + '">' + o.v + '</span></div>';
  }).join('');
  return '<div class="blk"><div class="r-label">Efficacy data ' + (a.refs ? '<sup>[' + a.refs.join(',') + ']</sup>' : '') + '</div>'
    + '<div class="outcomes-block">' + rows + '</div>'
    + (a.outV ? '<div class="o-note"><span class="chip verify">⚠ verify</span> approximate historical ranges — not trial results</div>' : '')
    + (a.outNote ? '<div class="o-note">' + a.outNote + '</div>' : '') + '</div>';
}
function rtHtml(a) {
  if (!a.rt) return '<div class="blk"><div class="r-label">Radiotherapy</div><div class="no-rt-box">' + a.noRt + '</div></div>';
  var r = a.rt;
  return '<div class="blk"><div class="rt-block"><div class="rt-block-title">Radiotherapy — Timing · Volumes · Doses</div>'
    + '<div class="rt-section"><div class="rt-section-hdr">Timing</div><div class="rt-note">' + r.timing + '</div></div>'
    + '<div class="rt-section"><div class="rt-section-hdr">Target volumes</div>' + r.vol.map(function(v) {
        return '<div class="rt-box"><div class="rt-box-label">' + v.l + '</div><div class="rt-box-val">' + v.v + '</div></div>';
      }).join('') + '</div>'
    + '<div class="rt-section"><div class="rt-section-hdr">Prescribed doses</div>' + r.doses.map(function(d) {
        return '<div class="rt-box"><div class="rt-box-label">' + d.l + '</div><div class="rt-box-val"><span class="rt-dose ' + (d.c || '') + '">' + d.d + '</span>'
          + (d.s ? '<div class="rt-sub">' + d.s + '</div>' : '') + '</div></div>';
      }).join('') + '</div>'
    + (r.verify ? '<div class="rt-section"><span class="chip verify">⚠ verify</span> <span class="rt-sub">' + r.verify + '</span></div>' : '')
    + '</div></div>';
}
function armHtml(a) {
  return '<div class="arm"><div class="arm-head ' + a.pc + '"><div><div class="arm-proto">' + a.proto + '</div><div class="arm-sub">' + a.label + '</div></div>'
    + '<span class="ev ' + a.ev + '" title="' + EVIDENCE[a.ev].d + '">' + EVIDENCE[a.ev].l + '</span></div>'
    + '<div class="arm-body">' + outcomesHtml(a)
    + '<div class="blk"><div class="r-label">Chemotherapy</div><div class="r-val">' + a.chemo + '</div></div>'
    + rtHtml(a)
    + (a.verifyArm ? '<div class="blk"><span class="chip verify">⚠ verify</span> <span class="rt-sub">' + a.verifyArm + '</span></div>' : '')
    + '</div></div>';
}
function refsHtml(e, ids) {
  return ids.map(function(n) {
    var r = e.refs[n];
    if (!r) return '';
    var links = [];
    if (r.doi) links.push('<a href="https://doi.org/' + r.doi + '" target="_blank">doi:' + r.doi + '</a>');
    if (r.nct) links.push('<a href="https://clinicaltrials.gov/study/' + r.nct + '" target="_blank">' + r.nct + '</a>');
    return '<div class="ref-item"><span class="ref-num">' + n + '</span><div><div class="ref-authors">' + r.a + '</div>'
      + '<div class="ref-title-text">' + r.t + '</div><div class="ref-journal">' + r.j + (links.length ? ' · ' + links.join(' · ') : '') + '</div>'
      + (r.n ? '<div class="ref-note">' + r.n + '</div>' : '') + '</div></div>';
  }).join('');
}
function sitOrder(e) {
  var ids = [];
  e.groups.forEach(function(g) { ids = ids.concat(g.ids); });
  return ids;
}
function renderSit(eid, sid) {
  var e = ENTITIES[eid], s = e.situations[sid];
  setCrumbs([ { t: e.name, h: '#/e/' + eid }, { t: s.badge } ]);
  var order = sitOrder(e), i = order.indexOf(sid);
  var refIds = [];
  s.arms.forEach(function(a) { (a.refs || []).forEach(function(r) { if (refIds.indexOf(r) < 0) refIds.push(r); }); });
  var noteRefs = (s.notes || '').match(/\[(\d+)/g) || [];
  noteRefs.forEach(function(m) { var n = parseInt(m.slice(1), 10); if (refIds.indexOf(n) < 0) refIds.push(n); });
  refIds.sort(function(a, b) { return a - b; });
  var arms = s.arms.map(armHtml).join('');
  if (e.pending) arms += e.pending.map(function(p) {
    return '<div class="arm pending"><div class="arm-head"><div><div class="arm-proto">' + p.proto + '</div><div class="arm-sub">future column</div></div><span class="ev pend">' + EVIDENCE.pend.l + '</span></div><div class="arm-body">' + p.t + '</div></div>';
  }).join('');
  var html = '<button class="btn-back" onclick="go(\'#/e/' + eid + '\')">← Decision map</button>'
    + '<div class="sit-card ' + s.risk + '"><div class="sit-head"><div><div class="sit-ent">' + e.name + '</div><div class="sit-title">' + s.title + '</div></div>'
    + '<span class="risk-badge ' + s.risk + '">' + s.badge + '</span></div><div class="sit-body">'
    + '<div class="r-label">Situation definition</div><div class="def-grid">' + s.def.map(function(d) {
        return '<div class="def-cell"><div class="def-k">' + d.k + '</div><div class="def-v">' + d.v + '</div></div>';
      }).join('') + '</div>'
    + '<div class="r-label">Treatment ' + (s.arms.length > 1 || e.pending ? '— protocols side by side' : '') + '</div>'
    + '<div class="arms">' + arms + '</div>'
    + (s.notes ? '<div class="common"><div class="r-label">⚠ Clinical notes</div><div class="note-box">' + s.notes + '</div></div>' : '')
    + '<div class="refs-list"><div class="r-label">References</div>' + refsHtml(e, refIds) + '</div>'
    + '<div class="sit-actions"><div style="display:flex;gap:8px">'
    + '<button class="btn" ' + (i > 0 ? 'onclick="go(\'#/e/' + eid + '/s/' + order[i - 1] + '\')"' : 'disabled') + '>← Previous</button>'
    + '<button class="btn" ' + (i < order.length - 1 ? 'onclick="go(\'#/e/' + eid + '/s/' + order[i + 1] + '\')"' : 'disabled') + '>Next →</button></div>'
    + '<button class="btn" onclick="window.print()">⬇ Export PDF</button></div>'
    + '<div class="print-footer">Pediatric Neuro-Oncology Atlas — ' + e.name + ' — decision support, does not replace the official protocols or MDT judgement.</div>'
    + '</div></div>';
  document.getElementById('view').innerHTML = html;
}

// ═══ LOGIGRAMME D3 ═══
var NODE_STYLE = {
  d:   { fill: '#dce8f5', stroke: '#1a5fa8', tc: '#0a1020' },
  lr:  { fill: '#d5edd8', stroke: '#2d7a3a', tc: '#0a1a0a' },
  sr:  { fill: '#d5e4f5', stroke: '#388bfd', tc: '#0a1020' },
  hr:  { fill: '#f5d8d5', stroke: '#c0392b', tc: '#200505' },
  sp:  { fill: '#f5ead5', stroke: '#a0720a', tc: '#201000' },
  inf: { fill: '#ece0f5', stroke: '#6b3fa0', tc: '#100020' },
  off: { fill: '#e8e8e8', stroke: '#888888', tc: '#333333' }
};
function buildFlow(e) {
  var host = document.getElementById('flowHost');
  var W = host.clientWidth || window.innerWidth, H = host.clientHeight || 600;
  var NW = 132, NH = 44, DY = 112;
  var svg = d3.select('#chart').attr('width', W).attr('height', H);
  svg.selectAll('*').remove();
  svg.append('defs').append('marker').attr('id', 'arr').attr('viewBox', '0 -5 10 10').attr('refX', 9).attr('refY', 0)
    .attr('markerWidth', 6).attr('markerHeight', 6).attr('orient', 'auto')
    .append('path').attr('d', 'M0,-5L10,0L0,5').attr('fill', '#6e7681');
  var g = svg.append('g');
  var root = d3.hierarchy(e.flow, function(d) { return d.children; });
  d3.tree().nodeSize([NW + 18, DY]).separation(function(a, b) { return a.parent === b.parent ? 1 : 1.15; })(root);

  root.links().forEach(function(l) {
    var sx = l.source.x, sy = l.source.y + NH / 2, tx = l.target.x, ty = l.target.y - NH / 2, my = (sy + ty) / 2;
    g.append('path').attr('d', 'M' + sx + ',' + sy + ' C' + sx + ',' + my + ' ' + tx + ',' + my + ' ' + tx + ',' + ty)
      .attr('fill', 'none').attr('stroke', '#6e7681').attr('stroke-width', 1.3).attr('marker-end', 'url(#arr)');
    if (l.target.data.e) {
      var lx = tx, ly = ty - 12;
      g.append('text').attr('x', lx).attr('y', ly).attr('text-anchor', 'middle').attr('font-size', '8.5')
        .attr('font-family', 'DM Mono, monospace').attr('fill', '#8b949e').text(l.target.data.e);
    }
  });

  var tt = document.getElementById('tt');
  root.descendants().forEach(function(n) {
    var sid = n.data.sid, sit = sid ? e.situations[sid] : null;
    var st = NODE_STYLE[sit ? sit.risk : 'd'];
    var grp = g.append('g').attr('transform', 'translate(' + (n.x - NW / 2) + ',' + (n.y - NH / 2) + ')').style('cursor', sit ? 'pointer' : 'default');
    grp.append('rect').attr('width', NW).attr('height', NH).attr('rx', sit ? 8 : 4)
      .attr('fill', st.fill).attr('stroke', st.stroke).attr('stroke-width', sit ? 2 : 1.4);
    grp.append('text').attr('x', NW / 2).attr('y', n.data.s ? 18 : 26).attr('text-anchor', 'middle')
      .attr('font-size', '10').attr('font-family', 'DM Mono, monospace').attr('font-weight', '500').attr('fill', st.tc).text(n.data.l);
    if (n.data.s) grp.append('text').attr('x', NW / 2).attr('y', 32).attr('text-anchor', 'middle')
      .attr('font-size', '8.5').attr('font-family', 'DM Sans, sans-serif').attr('fill', st.tc).text(n.data.s);
    if (sit) {
      grp.on('mousemove', function(ev) { showTT(ev, sit); })
        .on('mouseleave', function() { tt.style.display = 'none'; })
        .on('click', function() { tt.style.display = 'none'; go('#/e/' + e.id + '/s/' + sid); });
    }
  });

  var ns = root.descendants();
  var minX = d3.min(ns, function(n) { return n.x; }) - NW, maxX = d3.max(ns, function(n) { return n.x; }) + NW;
  var minY = -NH - 10, maxY = d3.max(ns, function(n) { return n.y; }) + NH + 20;
  var sc = Math.min(W / (maxX - minX), H / (maxY - minY), 1.2) * 0.92;
  var initT = d3.zoomIdentity.translate(W / 2 - (minX + maxX) / 2 * sc, H / 2 - (minY + maxY) / 2 * sc).scale(sc);
  var zoom = d3.zoom().scaleExtent([0.15, 3]).on('zoom', function(ev) { g.attr('transform', ev.transform); });
  svg.call(zoom); svg.call(zoom.transform, initT);
  document.getElementById('btnReset').onclick = function() { svg.transition().duration(600).call(zoom.transform, initT); };

  function showTT(ev, s) {
    var html = '<div class="tt-title">' + s.badge + '</div><div class="tt-q">' + s.title + '</div>';
    s.arms.forEach(function(a) {
      var first = a.out && a.out.length ? a.out[0].l + ': ' + a.out[0].v : '';
      html += '<div class="tt-section"><div class="tt-section-lbl">' + a.proto + ' · ' + a.label + '</div>'
        + '<div class="tt-val">' + a.key + '</div>' + (first ? '<div class="tt-out">' + first + '</div>' : '') + '</div>';
    });
    html += '<div class="tt-hint">Click to open the full card</div>';
    tt.innerHTML = html; tt.style.display = 'block';
    var x = ev.clientX + 16, y = ev.clientY - 10;
    if (x + 330 > window.innerWidth) x = ev.clientX - 340;
    if (y + tt.offsetHeight > window.innerHeight) y = window.innerHeight - tt.offsetHeight - 10;
    tt.style.left = x + 'px'; tt.style.top = Math.max(10, y) + 'px';
  }
}

// ═══ INIT ═══
initTheme();
fixLayout();
window.addEventListener('resize', fixLayout);
window.addEventListener('hashchange', route);
route();
</script>
